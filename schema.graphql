type Query {
  ping: Int!
  publishedDigestDates: [String!]!
  digest(date: String!): Digest
  availableSiteSources: [SiteSource!]!
  runStatus(runId: ID!): RunStatus
  runStatistics(runId: ID!): RunStatistics
}

type Digest {
  runId: ID!
  controlTime: String!
  periodStart: String!
  timezone: String!
  language: String!
  publishedAt: String!
  totalMaterials: Int!
  events: [DigestEvent!]!
  files: DigestFiles
}

type DigestEvent {
  id: ID!
  rank: Int!
  title: String!
  summary: String!
  consequences: String!
  selectionReason: String!
  sources: [DigestSource!]!
}

type DigestSource {
  id: ID!
  name: String!
  url: String
  publishedAt: String
}

type DigestFiles {
  digest: String
  post: String
  email: String
  csv: String
  emailSubject: String
}

type SiteSource {
  id: ID!
  name: String!
  taskUrl: String!
  searchDomain: String!
  status: String!
}

type RunStatus {
  runId: ID!
  status: String!
  error: String
  createdAt: String!
  startedAt: String
  finishedAt: String
  files: [String!]!
  diagnostics: RunDiagnostics!
}

type RunDiagnostics {
  collectionRunId: String
  digestRunId: String
  counts: RunDiagnosticCounts!
  warnings: [String!]!
  materials: [RunDiagnosticMaterial!]!
}

type RunDiagnosticCounts {
  candidates: Int!
  collected: Int!
  imported: Int!
  included: Int!
  merged: Int!
  excluded: Int!
  events: Int!
}

type RunDiagnosticMaterial {
  id: ID!
  url: String
  title: String
  stage: String!
  status: String!
  group: String
  reason: String
  error: String
}

type RunStatistics {
  runId: ID!
  status: String!
  inputMode: String!
  queueDurationMs: Float
  counts: RunDiagnosticCounts!
  exclusions: [RunExclusionStatistic!]!
  calls: [RunGenerationStatistic!]!
  discoverySources: [RunDiscoveryStatistic!]!
  evidence: [RunEvidenceStatistic!]!
  search: RunSearchStatistic!
  warnings: [String!]!
}

type RunExclusionStatistic {
  code: String!
  stage: String!
  site: String!
  count: Int!
}

type RunGenerationStatistic {
  stage: String!
  attempt: Int!
  model: String
  durationMs: Float
  inputTokens: Float
  outputTokens: Float
}

type RunDiscoveryStatistic {
  url: String!
  site: String!
  kind: String!
  attempted: Boolean!
  found: Int
  inspectedLinks: Int
  uninspectedLinks: Int
  outsideWindow: Int
  error: String
}

type RunEvidenceStatistic {
  stage: String!
  available: Boolean!
  exact: Int!
  normalized: Int!
  notFound: Int!
  other: Int!
}

type RunSearchStatistic {
  modelAttempts: Int!
  webSearchCalls: Int
  traceAvailable: Boolean!
}

type Mutation {
  subscribeEmail(email: String!): EmailSubscriptionPayload!
  publishDigest(runId: ID!): DigestPublicationPayload!
  login(input: AdminLoginInput!): AdminLoginPayload!
  startRun(input: RunStartInput!): RunStartPayload!
}

type EmailSubscriptionPayload {
  status: String!
  message: String!
}

type DigestPublicationPayload {
  runId: ID!
  publishedAt: String!
  alreadyPublished: Boolean!
  emailSent: Int!
  emailFailed: Int!
  emailPending: Int!
}

input AdminLoginInput {
  username: String!
  password: String!
}

type AdminLoginPayload {
  token: String!
  expiresIn: Int!
}

input RunStartInput {
  file: Upload
  sourceIds: [ID!]
  controlTime: String
}

scalar Upload

type RunStartPayload {
  runId: ID!
  imported: Int!
  rejected: Int!
  siteCount: Int!
  inputKind: String!
  dispatchStatus: String!
  status: String!
}
